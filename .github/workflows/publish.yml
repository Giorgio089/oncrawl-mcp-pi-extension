# Publishes the package to npmjs.com when a GitHub release is published.
# Authentication uses npm Trusted Publishing (OIDC) – no NPM_TOKEN secret.
# One-time setup on npmjs.com: package → Settings → Trusted Publisher →
# GitHub Actions, owner "Giorgio089", repository "oncrawl-mcp-pi-extension",
# workflow filename "publish.yml".
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest

      - name: Check release tag matches package.json version
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm publish --access public
